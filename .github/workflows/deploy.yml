name: Déploiement GitHub Pages

on:
  # Publication automatique à chaque mise à jour de la branche principale
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement manuellement depuis l'onglet Actions
  workflow_dispatch:

# Droits nécessaires à la publication sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui déjà en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construction du site
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npm run build

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoi du dossier dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
