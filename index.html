<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/tnt/favicon.svg" />
    <meta name="theme-color" content="#1a4474" />

    <!-- Prototype non public : on demande aux moteurs de ne pas indexer ni suivre les liens.
         Aucune balise Open Graph ni Twitter Card, afin qu'aucun aperçu enrichi au nom de
         Technital ne circule lors d'un partage du lien. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <title>Technital Libreville — Contrôle Technique Automobile</title>
    <meta
      name="description"
      content="Centre de contrôle technique automobile agréé, en convention avec la Mairie de Libreville. Prise de rendez-vous, simulateur de tarifs et vérification d'attestation en ligne."
    />

    <!-- Applique le thème avant le premier rendu pour éviter tout flash clair/sombre -->
    <script>
      (function () {
        try {
          var stocke = localStorage.getItem('technital-theme')
          var sombre = stocke ? stocke === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (sombre) document.documentElement.classList.add('dark')
        } catch (e) {
          /* stockage indisponible : on reste en thème clair */
        }
      })()
    </script>
    <script type="module" crossorigin src="/tnt/assets/index-BbtIsuIo.js"></script>
    <link rel="stylesheet" crossorigin href="/tnt/assets/index-g6coYCK_.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
